name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version matching project metadata
        required: true
        type: string
      dry_run:
        description: Validate distributions only; create no release, tag, or package upload
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Validate requested and packaged version
        id: version
        env:
          EXPECTED_RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/validate_release.py
      - name: Test release behavior
        run: python -m pytest tests -m 'not postgres' -n 2 --timeout=120 --junitxml=release-results.xml -q
      - name: Build and validate the exact distributions to publish
        run: |
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: release-distributions
          path: dist/*
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-validation
          path: release-results.xml

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ success() && (github.event_name == 'push' || !inputs.dry_run) }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - name: Upload the validated wheel and source distribution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" dist/* --target "$RELEASE_COMMIT" --title "MarketPipe v$RELEASE_VERSION" --generate-notes "${flags[@]}"

  publish:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: ${{ success() && (github.event_name == 'push' || !inputs.dry_run) }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist
      - run: python -m pip install twine
      - name: Publish validated artifacts
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
        run: python -m twine upload --repository testpypi dist/*

  summary:
    runs-on: ubuntu-latest
    needs: [validate, release, publish]
    if: always()
    steps:
      - env:
          VALIDATION: ${{ needs.validate.result }}
          RELEASE: ${{ needs.release.result }}
          PUBLICATION: ${{ needs.publish.result }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          test "$VALIDATION" = success
          if [ "$DRY_RUN" = true ]; then
            test "$RELEASE" = skipped
            test "$PUBLICATION" = skipped
            echo 'Rehearsal passed; no release, tag, or package upload was created.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$RELEASE" = success
            test "$PUBLICATION" = success
            echo 'Validated distributions published successfully.' >> "$GITHUB_STEP_SUMMARY"
          fi
