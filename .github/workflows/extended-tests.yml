name: Extended Tests

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Full offline integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - name: Full integration and E2E under bounded execution
        run: python -m pytest tests/integration tests/e2e -m 'not postgres' -n 2 --timeout=120 --durations=25 --basetemp=extended-artifacts --junitxml=extended-results.xml -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: extended-${{ matrix.python-version }}
          path: |
            extended-results.xml
            extended-artifacts/**/commands.log
            extended-artifacts/**/metrics-server.log
            extended-artifacts/**/*.csv

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketpipe
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: marketpipe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MARKETPIPE_TEST_POSTGRES_URL: postgresql://marketpipe:test-only-password@localhost:5432/marketpipe_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/e2e/test_migrations.py tests/integration/test_postgres_migrations.py --timeout=60 --junitxml=postgres-results.xml -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: postgres-results
          path: postgres-results.xml

  resources:
    name: Persistence with bounded resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Constrain descriptors and numerical worker threads
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          ulimit -n 128
          python -m pytest tests/e2e/test_concurrent_storage.py tests/e2e/test_recovery.py tests/e2e/test_failure_isolation.py --timeout=90 --junitxml=resource-results.xml -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: resource-results
          path: resource-results.xml
