name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      extended:
        description: Also require full integration, PostgreSQL, and resource checks
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Formatting and lint
        run: |
          black --check src/ tests/
          ruff check src/ tests/
          lint-imports --config pyproject.toml
      - name: Type checking
        run: mypy src/marketpipe/
        continue-on-error: true # Existing type debt is tracked separately.
      - name: Unit tests
        run: python -m pytest tests/unit --strict-markers --cov=marketpipe --cov-branch --timeout=60 --junitxml=unit-results.xml -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-${{ matrix.python-version }}
          path: |
            unit-results.xml
            .coverage

  e2e:
    name: Installed CLI and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Real offline journeys, provider contracts, and recovery
        run: python -m pytest tests/e2e -m 'not postgres' --strict-markers --timeout=90 --durations=15 --basetemp=e2e-artifacts --junitxml=e2e-results.xml -q
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-diagnostics
          path: |
            e2e-results.xml
            e2e-artifacts/**/commands.log
            e2e-artifacts/**/*.csv
            e2e-artifacts/**/*.parquet
            e2e-artifacts/**/*.db

  security:
    uses: ./.github/workflows/security.yml

  extended:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
    uses: ./.github/workflows/extended-tests.yml

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, e2e, security, extended]
    if: always()
    steps:
      - name: Require every gate
        env:
          UNIT_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          EXTENDED_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
          EXTENDED_RESULT: ${{ needs.extended.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$E2E_RESULT" = success
          test "$SECURITY_RESULT" = success
          if [ "$EXTENDED_REQUESTED" = true ]; then test "$EXTENDED_RESULT" = success; fi
          echo 'Unit matrix, installed E2E, and security gates passed.' >> "$GITHUB_STEP_SUMMARY"
