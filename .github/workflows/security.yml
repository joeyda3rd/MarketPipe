name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install runtime and scanner dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install . pip-audit bandit
      - name: Audit resolved dependencies
        run: pip-audit --format=json --output=audit-results.json --progress-spinner=off
      - name: Require no high severity, high confidence static findings
        if: ${{ !cancelled() }}
        run: bandit -r src/ -lll -iii -f json -o bandit-results.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-scan-results
          path: |
            audit-results.json
            bandit-results.json
      - name: Summarize actual scan results
        if: always()
        run: python scripts/security_summary.py
